# Upstream libxml2 release this port is built from.
UPSTREAM_NAME=libxml2
UPSTREAM_VERSION=2.15.4
UPSTREAM_URL=https://download.gnome.org/sources/libxml2/2.15/libxml2-2.15.4.tar.xz
# GNOME publishes a SHA-256 sum (libxml2-2.15.4.sha256sum beside the tarball)
# and no signature for libxml2 releases, so the pin is the checksum alone.
UPSTREAM_SHA256=98087fd181d9070724f3fbc65c7377db03038eb92bd882374daff44940138821
# Our patch level on top of the upstream release (2.15.4-vms1)
VMS_PATCH_LEVEL=1
# Features (configure options) for the generated include/libxml/xmlversion.h:
# PHP's XML extensions need none of threads, iconv (libxml2 has built-in
# UTF-8/16 and ISO-8859-x tables), ICU, zlib, HTTP or dynamic modules
# (docs/DECISIONS.md D2).
XML_OPTIONS="--without-threads --without-iconv --without-icu --without-zlib --without-lzma --without-http --without-modules --without-python --without-readline --without-history"
